# apps started from gnome find the same tools as the shell
PATH=$HOME/.local/bin:${XDG_DATA_HOME:-$HOME/.local/share}/mise/shims:$HOME/.cargo/bin:$PATH:${XDG_DATA_HOME:-$HOME/.local/share}/nvim/mason/bin:$HOME/.lmstudio/bin
# the unity cli, from the hub or claude too: no usage pings, crash reports or plugin tips, and no update
# check, as dot update updates it
UNITY_NO_CLI_INVOKED_TELEMETRY=1
UNITY_NO_CRASH_REPORT=1
UNITY_NO_AGENT_HINTS=1
UNITY_NO_UPDATE_CHECK=1
