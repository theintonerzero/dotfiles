# ghostty on macos
# option is alt, for claude code's alt+s, fzf's alt+c and tmux's alt keys, as on fedora
macos-option-as-alt = true
# the see-through background blurred, as blur my shell does it on fedora
background-blur = true
# ctrl+cmd+enter opens a new window from any app, as super+enter does on fedora; ghostty has to be
# running, and macos asks once to let it see keys (privacy & security > accessibility)
keybind = global:ctrl+cmd+enter=new_window
