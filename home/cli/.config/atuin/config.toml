# atuin, local only: no sync, no update check, no ai
auto_sync = false
update_check = false
search_mode = "fuzzy"
filter_mode = "global"
style = "compact"
inline_height = 20
show_preview = true
show_help = false
# enter puts the command on the line; a second enter runs it
enter_accept = false
secrets_filter = true

[ai]
enabled = false
