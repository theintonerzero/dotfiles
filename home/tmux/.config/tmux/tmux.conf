# tmux, with no plugins; its status bar uses the prompt's palette

# the terminal: true colour, extended keys and the clipboard through ghostty
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:usstyle:hyperlinks:sync:clipboard"
set -s extended-keys on
set -s extended-keys-format csi-u
set -s set-clipboard on
set -s focus-events on
set -s escape-time 10

set -g history-limit 10000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# closing a session moves you to another one, not out of tmux
set -g detach-on-destroy off
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ctrl+a is the prefix; ctrl+a twice sends one to the program
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"
bind K display-popup -E -w 60% -h 70% "sesh picker -i"
bind G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind C-l send-keys C-l

# ctrl+h/j/k/l move between panes and neovim's splits (neovim's smart-splits sets @pane-is-vim);
# alt+h/j/k/l resize; at a window's edge, or alone, the program in the pane gets the key
bind -n C-h if -F "#{||:#{@pane-is-vim},#{pane_at_left}}" { send-keys C-h } { select-pane -L }
bind -n C-j if -F "#{||:#{@pane-is-vim},#{pane_at_bottom}}" { send-keys C-j } { select-pane -D }
bind -n C-k if -F "#{||:#{@pane-is-vim},#{pane_at_top}}" { send-keys C-k } { select-pane -U }
bind -n C-l if -F "#{||:#{@pane-is-vim},#{pane_at_right}}" { send-keys C-l } { select-pane -R }
bind -n M-h if -F "#{||:#{@pane-is-vim},#{==:#{window_panes},1}}" { send-keys M-h } { resize-pane -L 3 }
bind -n M-j if -F "#{||:#{@pane-is-vim},#{==:#{window_panes},1}}" { send-keys M-j } { resize-pane -D 3 }
bind -n M-k if -F "#{||:#{@pane-is-vim},#{==:#{window_panes},1}}" { send-keys M-k } { resize-pane -U 3 }
bind -n M-l if -F "#{||:#{@pane-is-vim},#{==:#{window_panes},1}}" { send-keys M-l } { resize-pane -R 3 }

# the status line, at the top, in pills like the prompt's and its kanagawa dragon palette: windows on the left,
# the current one in the accent colour; prefix, session, host and time on the right
set -g status-style "bg=default,fg=#c5c9c5"
set -g status-position top
set -g status-left ""
set -g window-status-format "#[fg=#282727,bg=default]#[fg=#c5c9c5,bg=#282727]#I #W#[fg=#282727,bg=default,nobold]"
set -g window-status-current-format "#[fg=#7a8382,bg=default]#[fg=#0d0c0c,bg=#7a8382,bold]#I #W#[fg=#7a8382,bg=default,nobold]"
set -g window-status-separator " "
# tmux underlines the current window and reverses busy ones by default; the pills are enough
set -g window-status-current-style "default"
set -g window-status-activity-style "default"
set -g status-right "#{?client_prefix,#[fg=#c4b28a#,bg=default]#[fg=#0d0c0c#,bg=#c4b28a#,bold]prefix#[fg=#c4b28a#,bg=default#,nobold] ,}#[fg=#7a8382,bg=default]#[fg=#0d0c0c,bg=#7a8382,bold]#S#[fg=#7a8382,bg=default,nobold] #[fg=#282727,bg=default]#[fg=#c5c9c5,bg=#282727]#h · %H:%M#[fg=#282727,bg=default,nobold]"
set -g status-right-length 80
set -g pane-border-style "fg=#282727"
set -g pane-active-border-style "fg=#7a8382"
set -g message-style "bg=default,fg=#c4b28a"
set -g mode-style "bg=#7a8382,fg=#0d0c0c"
